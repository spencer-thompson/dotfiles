<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Keep desktop, browser defaults, and terminals on the same family.
       Fontconfig still supplies fallback glyphs for emoji and other scripts. -->
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Berkeley Mono Variable</family></prefer>
  </alias>
  <alias binding="strong">
    <family>serif</family>
    <prefer><family>Berkeley Mono Variable</family></prefer>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>Berkeley Mono Variable</family></prefer>
  </alias>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>Berkeley Mono Variable</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Berkeley Mono</family>
    <prefer><family>Berkeley Mono Variable</family></prefer>
  </alias>

  <match target="scan">
    <test name="family" compare="eq">
      <string>Berkeley Mono Variable</string>
    </test>
    <edit name="spacing" mode="assign">
      <int>100</int>
    </edit>
  </match>

  <match target="font">
    <test name="family" compare="eq">
      <string>Berkeley Mono Variable</string>
    </test>
    <edit name="spacing" mode="assign">
      <int>100</int>
    </edit>
    <edit name="autohint" mode="assign">
      <bool>true</bool>
    </edit>
  </match>

  <match target="font">
    <edit name="antialias" mode="assign">
      <bool>true</bool>
    </edit>
    <edit name="hinting" mode="assign">
      <bool>true</bool>
    </edit>
    <edit name="hintstyle" mode="assign">
      <const>hintslight</const>
    </edit>
    <edit name="rgba" mode="assign">
      <const>none</const>
    </edit>
    <edit name="lcdfilter" mode="assign">
      <const>lcddefault</const>
    </edit>
  </match>
</fontconfig>
