# Activated on the next WirePlumber start. No service restart during calls.
wireplumber.components = [
  { name = "90-personal-audio.lua", type = script/lua,
    provides = hooks.personal-audio,
    requires = [ support.client-context ] }
]
wireplumber.profiles = { main = { hooks.personal-audio = required } }

# Native saved microphone choices still take precedence over this fallback priority.
monitor.alsa.rules = [
  { matches = [ { node.name = "alsa_input.usb-DJI_Technology_Co.__Ltd._Wireless_Mic_Rx_XSP12345678-00.analog-stereo" } ]
    actions = { update-props = { priority.session = 2500 } } }
]
